AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AVR Management Hotel Operations Platform

Parameters:
  StackPrefix:
    Type: String
    Default: avr
    Description: Prefix for resource names
  OwnerEmail:
    Type: String
    Default: rohit_gazer@yahoo.com
    Description: Email address for billing alarm notifications
  AlertEmailLow:
    Type: Number
    Default: 5
    Description: Lower billing alarm threshold (USD)
  AlertEmailHigh:
    Type: Number
    Default: 20
    Description: Higher billing alarm threshold (USD)
  DeployFrontend:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Set to 'true' to deploy S3 + CloudFront (requires AWS account verification)

Conditions:
  ShouldDeployFrontend: !Equals [!Ref DeployFrontend, 'true']

Globals:
  Function:
    Runtime: python3.11
    Timeout: 15
    MemorySize: 256
    Architectures:
      - arm64
    Environment:
      Variables:
        TABLE_SHIFT_TASKS: !Ref ShiftTasksTable
        TABLE_INVENTORY: !Ref InventoryTable
        TABLE_CHECKLISTS: !Ref ChecklistsTable
        TABLE_ROOMS: !Ref RoomEquipmentTable
        TABLE_LINEN: !Ref LinenCountsTable
        TABLE_PARKFLY: !Ref ParkAndFlyTable
        TABLE_REPORTS: !Ref CachedReportsTable
        USER_POOL_ID: !Ref UserPool
        USER_POOL_CLIENT_ID: !Ref UserPoolClient
        CLOUDBEDS_SECRET_PREFIX: !Sub '${StackPrefix}/cloudbeds'

Resources:

  # ================================================================
  # Cognito User Pool
  # ================================================================
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${StackPrefix}-users'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireNumbers: true
          RequireLowercase: false
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: role
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: property
          AttributeDataType: String
          Mutable: true
          Required: false
      MfaConfiguration: 'OPTIONAL'
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub '${StackPrefix}-spa-client'
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # ================================================================
  # DynamoDB Tables (on-demand)
  # ================================================================
  ShiftTasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackPrefix}-shift-tasks'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: DailyTasksIndex
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  InventoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackPrefix}-inventory'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  ChecklistsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackPrefix}-checklists'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  RoomEquipmentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackPrefix}-rooms'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  LinenCountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackPrefix}-linen'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  ParkAndFlyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackPrefix}-parkfly'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ActiveVehiclesIndex
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  CachedReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackPrefix}-reports-cache'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # ================================================================
  # API Gateway HTTP API + Cognito JWT Authorizer
  # ================================================================
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - https://avrhospitality.com
          - https://www.avrhospitality.com
          - https://avr-hospitality.pages.dev
          - http://localhost:5173
          - http://localhost:5174
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        MaxAge: 600
      Auth:
        Authorizers:
          CognitoJwt:
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience:
                - !Ref UserPoolClient
            IdentitySource: '$request.header.Authorization'
        DefaultAuthorizer: CognitoJwt

  # ================================================================
  # Lambda Functions (one per domain)
  # ================================================================
  ShiftsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackPrefix}-shifts'
      CodeUri: backend/
      Handler: shifts.handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ShiftTasksTable
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/shifts/{proxy+}' }
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/shifts/{proxy+}' }
        Put:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: '/api/shifts/{proxy+}' }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/shifts/{proxy+}' }

  InventoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackPrefix}-inventory'
      CodeUri: backend/
      Handler: inventory.handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InventoryTable
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/inventory/{proxy+}' }
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/inventory/{proxy+}' }
        Put:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: '/api/inventory/{proxy+}' }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/inventory/{proxy+}' }

  ChecklistsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackPrefix}-checklists'
      CodeUri: backend/
      Handler: checklists.handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ChecklistsTable
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/checklists/{proxy+}' }
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/checklists/{proxy+}' }
        Put:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: '/api/checklists/{proxy+}' }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/checklists/{proxy+}' }

  RoomsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackPrefix}-rooms'
      CodeUri: backend/
      Handler: rooms.handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RoomEquipmentTable
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/rooms/{proxy+}' }
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/rooms/{proxy+}' }
        Put:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: '/api/rooms/{proxy+}' }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/rooms/{proxy+}' }

  ParkflyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackPrefix}-parkfly'
      CodeUri: backend/
      Handler: parkfly.handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ParkAndFlyTable
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/parkfly/{proxy+}' }
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/parkfly/{proxy+}' }
        Put:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: '/api/parkfly/{proxy+}' }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/parkfly/{proxy+}' }

  LinenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackPrefix}-linen'
      CodeUri: backend/
      Handler: linen.handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LinenCountsTable
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/linen/{proxy+}' }
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/linen/{proxy+}' }
        Put:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: '/api/linen/{proxy+}' }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/linen/{proxy+}' }

  ReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackPrefix}-reports'
      CodeUri: backend/
      Handler: reports.handler.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CachedReportsTable
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/reports/{proxy+}' }

  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackPrefix}-admin'
      CodeUri: backend/
      Handler: admin.handler.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminDisableUser
                - cognito-idp:AdminEnableUser
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminResetUserPassword
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:ListUsers
                - cognito-idp:AdminGetUser
              Resource: !GetAtt UserPool.Arn
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/admin/{proxy+}' }
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/admin/{proxy+}' }
        Put:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: '/api/admin/{proxy+}' }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/admin/{proxy+}' }

  SyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackPrefix}-sync'
      CodeUri: backend/
      Handler: sync.handler.handler
      Timeout: 120
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CachedReportsTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:PutSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${StackPrefix}/cloudbeds/*'
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(6 hours)
            Enabled: false

  # ================================================================
  # Secrets Manager (Cloudbeds OAuth - Saco Bay only for now)
  # ================================================================
  SacoBayCloudbedsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${StackPrefix}/cloudbeds/saco_bay'
      Description: Cloudbeds OAuth credentials for Saco Bay
      SecretString: '{"client_id":"PLACEHOLDER","client_secret":"PLACEHOLDER","refresh_token":"PLACEHOLDER","api_key":"PLACEHOLDER"}'

  # ================================================================
  # S3 + CloudFront for frontend
  # ================================================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldDeployFrontend
    Properties:
      BucketName: !Sub '${StackPrefix}-frontend-${AWS::AccountId}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: ShouldDeployFrontend
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${StackPrefix}-frontend-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: ShouldDeployFrontend
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt FrontendOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponsePagePath: /index.html
            ResponseCode: 200
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponsePagePath: /index.html
            ResponseCode: 200
            ErrorCachingMinTTL: 0

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ShouldDeployFrontend
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

  # ================================================================
  # Billing Alarms
  # ================================================================
  BillingAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${StackPrefix}-billing-alarms'
      Subscription:
        - Endpoint: !Ref OwnerEmail
          Protocol: email

  BillingAlarmLow:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${StackPrefix}-billing-low'
      AlarmDescription: !Sub 'AWS estimated charges exceeded $${AlertEmailLow}'
      MetricName: EstimatedCharges
      Namespace: AWS/Billing
      Statistic: Maximum
      Period: 21600
      EvaluationPeriods: 1
      Threshold: !Ref AlertEmailLow
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: Currency
          Value: USD
      AlarmActions:
        - !Ref BillingAlarmTopic

  BillingAlarmHigh:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${StackPrefix}-billing-high'
      AlarmDescription: !Sub 'AWS estimated charges exceeded $${AlertEmailHigh}'
      MetricName: EstimatedCharges
      Namespace: AWS/Billing
      Statistic: Maximum
      Period: 21600
      EvaluationPeriods: 1
      Threshold: !Ref AlertEmailHigh
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: Currency
          Value: USD
      AlarmActions:
        - !Ref BillingAlarmTopic

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  ApiUrl:
    Description: HTTP API base URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  CloudFrontUrl:
    Description: CloudFront distribution URL (frontend)
    Condition: ShouldDeployFrontend
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  FrontendBucket:
    Description: S3 bucket for frontend uploads
    Condition: ShouldDeployFrontend
    Value: !Ref FrontendBucket
  Region:
    Description: Deployment region
    Value: !Ref AWS::Region
