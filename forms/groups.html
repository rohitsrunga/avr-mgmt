<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>Group Inquiry · Casco Bay Hotel</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="brand">
      <div class="mark">A</div>
      <div class="meta">
        <div class="name">Casco Bay Hotel</div>
        <div class="sub">AVR Hospitality</div>
      </div>
    </header>

    <h1 class="page-title">Group inquiry</h1>
    <p class="page-subtitle">Tell us about your group. We'll follow up within one business day.</p>

    <div id="banner-error" class="banner error hidden"></div>

    <form id="inquiry-form" class="card">
      <div class="field">
        <label for="group_name">Group / organization name</label>
        <input id="group_name" name="group_name" type="text" required maxlength="200" autocomplete="organization" />
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="contact_name">Your name</label>
          <input id="contact_name" name="contact_name" type="text" required maxlength="120" autocomplete="name" />
        </div>
        <div class="field">
          <label for="contact_phone">Phone</label>
          <input id="contact_phone" name="contact_phone" type="tel" required maxlength="40" autocomplete="tel" />
        </div>
        <div class="field full">
          <label for="contact_email">Email <span class="muted">(optional)</span></label>
          <input id="contact_email" name="contact_email" type="email" maxlength="120" autocomplete="email" />
        </div>
        <div class="field full">
          <label for="company_address">Company address <span class="muted">(optional)</span></label>
          <input id="company_address" name="company_address" type="text" maxlength="300" autocomplete="street-address" />
        </div>
        <div class="field">
          <label for="check_in_date">Check-in</label>
          <input id="check_in_date" name="check_in_date" type="date" required />
        </div>
        <div class="field">
          <label for="check_out_date">Check-out</label>
          <input id="check_out_date" name="check_out_date" type="date" required />
        </div>
        <div class="field">
          <label for="room_count">Rooms needed</label>
          <input id="room_count" name="room_count" type="number" min="1" max="200" required />
        </div>
        <div class="field">
          <label for="room_type">Room type</label>
          <select id="room_type" name="room_type" required>
            <option value="standard">Standard</option>
            <option value="triple">Triple</option>
            <option value="quad">Quad</option>
            <option value="mixed">Mixed</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="special_notes">Notes <span class="muted">(arrival times, dietary, billing)</span></label>
        <textarea id="special_notes" name="special_notes" maxlength="1000"></textarea>
      </div>

      <button type="submit" class="btn primary block" id="submit-btn">Submit inquiry</button>
    </form>

    <div id="success" class="card success-state hidden">
      <div class="check"></div>
      <h2>Inquiry received</h2>
      <p>Our group sales team will be in touch within one business day.</p>
    </div>

    <footer class="foot">AVR Hospitality Management</footer>
  </div>

  <script>
    window.__API_BASE = window.__API_BASE || '__API_BASE__';

    function getProperty() {
      const url = new URL(window.location.href);
      return url.searchParams.get('p') || 'casco_bay';
    }

    function showError(msg) {
      const b = document.getElementById('banner-error');
      b.textContent = msg;
      b.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function hideError() {
      document.getElementById('banner-error').classList.add('hidden');
    }

    document.getElementById('inquiry-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const form = e.target;
      const btn = document.getElementById('submit-btn');
      const payload = {
        group_name: form.group_name.value.trim(),
        contact_name: form.contact_name.value.trim(),
        contact_phone: form.contact_phone.value.trim(),
        contact_email: form.contact_email.value.trim(),
        company_address: form.company_address.value.trim(),
        check_in_date: form.check_in_date.value,
        check_out_date: form.check_out_date.value,
        room_count: Number(form.room_count.value),
        room_type: form.room_type.value,
        special_notes: form.special_notes.value.trim(),
      };
      if (!payload.group_name) return showError('Please enter the group name.');
      if (!payload.contact_name || !payload.contact_phone) return showError('Please add your name and phone number.');
      if (payload.check_out_date < payload.check_in_date) return showError('Check-out must be on or after check-in.');
      if (!Number.isFinite(payload.room_count) || payload.room_count < 1) return showError('Room count must be 1 or more.');

      btn.disabled = true;
      btn.textContent = 'Submitting…';
      try {
        const res = await fetch(`${window.__API_BASE}/api/public/groups/${getProperty()}/inquiry`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || `HTTP ${res.status}`);
        }
        form.classList.add('hidden');
        document.getElementById('success').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        showError(err.message || 'Could not submit. Please call the hotel directly.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Submit inquiry';
      }
    });
  </script>
</body>
</html>
