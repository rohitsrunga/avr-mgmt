AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AVR Management Hotel Operations Platform

Parameters:
  StackPrefix:
    Type: String
    Default: avr
    Description: Prefix for resource names
  OwnerEmail:
    Type: String
    Default: rohit_gazer@yahoo.com
    Description: Email address for billing alarm notifications
  AlertEmailLow:
    Type: Number
    Default: 5
    Description: Lower billing alarm threshold (USD)
  AlertEmailHigh:
    Type: Number
    Default: 20
    Description: Higher billing alarm threshold (USD)
  DeployFrontend:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Set to 'true' to deploy S3 + CloudFront (requires AWS account verification)

Conditions:
  ShouldDeployFrontend: !Equals [!Ref DeployFrontend, 'true']

Globals:
  Function:
    Runtime: python3.11
    Timeout: 15
    MemorySize: 256
    Architectures:
      - arm64
    Environment:
      Variables:
        TABLE_SHIFT_TASKS: !Ref ShiftTasksTable
        TABLE_INVENTORY: !Ref InventoryTable
        TABLE_CHECKLISTS: !Ref ChecklistsTable
        TABLE_ROOMS: !Ref RoomEquipmentTable
        TABLE_PARKFLY: !Ref ParkAndFlyTable
        TABLE_DINNER_ORDERS: !Ref DinnerOrdersTable
        TABLE_HOUSEKEEPING: !Ref HousekeepingTable
        TABLE_REPORTS: !Ref CachedReportsTable
        TABLE_EMPLOYEES: !Ref EmployeesTable
        TABLE_BUSINESS_CASE: !Ref BusinessCaseTable
        TABLE_GROUP_CONTRACTS: !Ref GroupContractsTable
        TABLE_INSPECTIONS: !Ref InspectionsTable
        TABLE_SETTINGS: !Ref SettingsTable
        TABLE_FINANCE: !Ref FinanceTable
        EMPLOYEES_FILLED_BUCKET: !Ref EmployeesFilledBucket
        PUBLIC_FORMS_BUCKET: !Ref PublicFormsBucket
        INSPECTION_PHOTOS_BUCKET: !Ref InspectionPhotosBucket
        USER_POOL_ID: !Ref UserPool
        USER_POOL_CLIENT_ID: !Ref UserPoolClient
        CLOUDBEDS_SECRET_PREFIX: !Sub '${StackPrefix}/cloudbeds'

Resources:

  # ================================================================
  # Cognito User Pool
  # ================================================================
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${StackPrefix}-users'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireNumbers: true
          RequireLowercase: false
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: role
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: property
          AttributeDataType: String
          Mutable: true
          Required: false
      MfaConfiguration: 'OPTIONAL'
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub '${StackPrefix}-spa-client'
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # ================================================================
  # DynamoDB Tables (on-demand)
  # ================================================================
  ShiftTasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackPrefix}-shift-tasks'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: DailyTasksIndex
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  InventoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackPrefix}-inventory'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  ChecklistsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackPrefix}-checklists'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  RoomEquipmentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackPrefix}-rooms'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  ParkAndFlyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackPrefix}-parkfly'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ActiveVehiclesIndex
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  DinnerOrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackPrefix}-dinner-orders'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  HousekeepingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackPrefix}-housekeeping'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  CachedReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackPrefix}-reports-cache'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  EmployeesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackPrefix}-employees'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: TokenIndex
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ----------------------------------------------------------------
  # Business Case — daily marketing/business tasks (Casco Bay)
  # PK = PROPERTY#<id>
  # SK = DAILY#<YYYY-MM-DD>#TASK#<task_id>
  # ----------------------------------------------------------------
  BusinessCaseTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackPrefix}-business-case'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # ----------------------------------------------------------------
  # Group Contracts — group bookings + activity log (Casco Bay)
  # PK = PROPERTY#<id>
  # SK = CONTRACT#<contract_id>             (contract record)
  # SK = CONTRACT#<contract_id>#LOG#<ts>    (activity note)
  # ----------------------------------------------------------------
  GroupContractsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackPrefix}-group-contracts'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # ----------------------------------------------------------------
  # Inspections — room inspections, issues, inspector roster (Casco)
  # PK = PROPERTY#<id>
  # SK patterns:
  #   INSPECTOR#<inspector_id>
  #   INSPECTION#<YYYY-MM-DD>#<inspection_id>
  #   ISSUE#<issue_id>
  # ----------------------------------------------------------------
  InspectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackPrefix}-inspections'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # ----------------------------------------------------------------
  # Settings — per-property feature flags (owner-configurable from
  # the Admin tab). PK = PROPERTY#<id>, SK = FEATURES.
  # An item's `enabled` attribute is a string-set of feature ids;
  # absence of an item means "all features enabled" (default).
  # ----------------------------------------------------------------
  SettingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackPrefix}-settings'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # ----------------------------------------------------------------
  # Finance — monthly USALI P&L actuals / budgets / forecast inputs.
  # Actuals are written by scripts/qb_ingest_pnl.py (local QuickBooks
  # pull → USALI map). Budgets & assumptions are owner/manager-entered.
  # PK = PROPERTY#<id>
  # SK patterns:
  #   ACTUAL#<YYYY-MM>       monthly mapped actuals (from QuickBooks)
  #   BUDGET#<YYYY-MM>       monthly user-entered budget
  #   ASSUMPTIONS#<YYYY>     forecast inputs (occupancy/ADR/season/drivers)
  # ----------------------------------------------------------------
  FinanceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackPrefix}-finance'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # ================================================================
  # Private S3 bucket for inspection before/after photos.
  # Backend issues short-lived presigned PUT (upload) and GET (view)
  # URLs. Bucket itself blocks all public access.
  # ================================================================
  InspectionPhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${StackPrefix}-inspection-photos-${AWS::AccountId}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT]
            AllowedOrigins: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3600

  # ================================================================
  # API Gateway HTTP API + Cognito JWT Authorizer
  # ================================================================
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - https://avrhospitality.com
          - https://www.avrhospitality.com
          - https://avr-hospitality.pages.dev
          - https://avr-mgmt.abhijit-s91.workers.dev
          - http://localhost:5173
          - http://localhost:5174
          - http://localhost:8000
          - !Sub 'http://${StackPrefix}-public-forms-${AWS::AccountId}.s3-website-${AWS::Region}.amazonaws.com'
          - !Sub 'https://${StackPrefix}-public-forms-${AWS::AccountId}.s3.${AWS::Region}.amazonaws.com'
          - !Sub 'https://${StackPrefix}-public-forms-${AWS::AccountId}.s3.amazonaws.com'
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        MaxAge: 600
      Auth:
        Authorizers:
          CognitoJwt:
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience:
                - !Ref UserPoolClient
            IdentitySource: '$request.header.Authorization'
        DefaultAuthorizer: CognitoJwt

  # ================================================================
  # Lambda Functions (one per domain)
  # ================================================================
  ShiftsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackPrefix}-shifts'
      CodeUri: backend/
      Handler: shifts.handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ShiftTasksTable
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/shifts/{proxy+}' }
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/shifts/{proxy+}' }
        Put:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: '/api/shifts/{proxy+}' }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/shifts/{proxy+}' }

  InventoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackPrefix}-inventory'
      CodeUri: backend/
      Handler: inventory.handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InventoryTable
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/inventory/{proxy+}' }
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/inventory/{proxy+}' }
        Put:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: '/api/inventory/{proxy+}' }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/inventory/{proxy+}' }
        PublicGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: '/api/public/inventory/{proxy+}'
            Auth: { Authorizer: NONE }
        PublicPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: '/api/public/inventory/{proxy+}'
            Auth: { Authorizer: NONE }

  ChecklistsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackPrefix}-checklists'
      CodeUri: backend/
      Handler: checklists.handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ChecklistsTable
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/checklists/{proxy+}' }
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/checklists/{proxy+}' }
        Put:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: '/api/checklists/{proxy+}' }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/checklists/{proxy+}' }

  RoomsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackPrefix}-rooms'
      CodeUri: backend/
      Handler: rooms.handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RoomEquipmentTable
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/rooms/{proxy+}' }
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/rooms/{proxy+}' }
        Put:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: '/api/rooms/{proxy+}' }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/rooms/{proxy+}' }

  ParkflyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackPrefix}-parkfly'
      CodeUri: backend/
      Handler: parkfly.handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ParkAndFlyTable
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/parkfly/{proxy+}' }
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/parkfly/{proxy+}' }
        Put:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: '/api/parkfly/{proxy+}' }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/parkfly/{proxy+}' }

  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackPrefix}-admin'
      CodeUri: backend/
      Handler: admin.handler.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminDisableUser
                - cognito-idp:AdminEnableUser
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminResetUserPassword
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:ListUsers
                - cognito-idp:AdminGetUser
              Resource: !GetAtt UserPool.Arn
        - DynamoDBCrudPolicy:
            TableName: !Ref SettingsTable
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/admin/{proxy+}' }
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/admin/{proxy+}' }
        Put:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: '/api/admin/{proxy+}' }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/admin/{proxy+}' }

  # ----------------------------------------------------------------
  # Dinner Orders (Casco Bay evening dinner program)
  # /api/dinner-orders/*        — authenticated dashboard
  # /api/public/dinner-orders/* — public submission form (Auth: NONE)
  # ----------------------------------------------------------------
  DinnerOrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackPrefix}-dinner-orders'
      CodeUri: backend/
      Handler: dinner_orders.handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DinnerOrdersTable
        - DynamoDBReadPolicy:
            TableName: !Ref SettingsTable
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/dinner-orders/{proxy+}' }
        Put:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: '/api/dinner-orders/{proxy+}' }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/dinner-orders/{proxy+}' }
        PublicGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: '/api/public/dinner-orders/{proxy+}'
            Auth: { Authorizer: NONE }
        PublicPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: '/api/public/dinner-orders/{proxy+}'
            Auth: { Authorizer: NONE }

  # ----------------------------------------------------------------
  # Housekeeping (roster + room assignments, both properties)
  # /api/housekeeping/*        — authenticated dashboard
  # /api/public/housekeeping/* — public form for housekeepers (Auth: NONE)
  # ----------------------------------------------------------------
  HousekeepingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackPrefix}-housekeeping'
      CodeUri: backend/
      Handler: housekeeping.handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HousekeepingTable
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/housekeeping/{proxy+}' }
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/housekeeping/{proxy+}' }
        Put:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: '/api/housekeeping/{proxy+}' }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/housekeeping/{proxy+}' }
        PublicGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: '/api/public/housekeeping/{proxy+}'
            Auth: { Authorizer: NONE }
        PublicPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: '/api/public/housekeeping/{proxy+}'
            Auth: { Authorizer: NONE }

  # ----------------------------------------------------------------
  # Reports (read-only PMS metrics for the Overview tab)
  # Backed by CachedReportsTable, populated by SyncFunction every 6h.
  # ----------------------------------------------------------------
  ReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackPrefix}-reports'
      CodeUri: backend/
      Handler: reports.handler.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CachedReportsTable
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/reports/{proxy+}' }

  # ----------------------------------------------------------------
  # Cloudbeds sync (Saco Bay) — pulls dashboard data into the cache.
  # Authenticates with a property-level cbat_ API key as Bearer.
  # EventBridge schedule starts disabled; enable after running the
  # cloudbeds_oauth_setup.py script to populate the secret.
  # ----------------------------------------------------------------
  SyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackPrefix}-sync'
      CodeUri: backend/
      Handler: sync.handler.handler
      Timeout: 120
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CachedReportsTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:PutSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${StackPrefix}/cloudbeds/*'
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(6 hours)
            Enabled: false
        TriggerSync:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/sync/cloudbeds' }

  # ----------------------------------------------------------------
  # Finance reconciliation (Saco Bay) — live 3-stage money trace
  # (charged → received → posted) over a date range, sourced from the
  # Cloudbeds Data Insights stock reports. Read-only, on-demand, no cache.
  # ----------------------------------------------------------------
  FinanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackPrefix}-finance'
      CodeUri: backend/
      Handler: finance.handler.handler
      Timeout: 60
      MemorySize: 512
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${StackPrefix}/cloudbeds/*'
        - DynamoDBCrudPolicy:
            TableName: !Ref FinanceTable
        - DynamoDBReadPolicy:
            TableName: !Ref SettingsTable
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/finance/{proxy+}' }
        Put:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: '/api/finance/{proxy+}' }
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/finance/{proxy+}' }

  # ================================================================
  # Secrets Manager (Cloudbeds API key — Saco Bay only for now)
  # ================================================================
  SacoBayCloudbedsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${StackPrefix}/cloudbeds/saco_bay'
      Description: Cloudbeds property-level API key for Saco Bay
      SecretString: '{"api_key":"PLACEHOLDER","client_id":"PLACEHOLDER","client_secret":"PLACEHOLDER"}'

  # ================================================================
  # Public Forms S3 bucket — static HTML for unauthenticated forms.
  # Hosts dinner.html and housekeeping.html.
  # ================================================================
  PublicFormsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${StackPrefix}-public-forms-${AWS::AccountId}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET]
            AllowedOrigins: ['*']
            MaxAge: 3600

  PublicFormsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PublicFormsBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${PublicFormsBucket.Arn}/*'

  # ================================================================
  # Employees filled-form bucket — private. Holds the rendered HTML
  # of each submitted onboarding packet, fetched via pre-signed URL
  # from the admin UI.
  # ================================================================
  EmployeesFilledBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${StackPrefix}-employees-filled-${AWS::AccountId}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ----------------------------------------------------------------
  # Employees onboarding Lambda
  # /api/admin/employees/*       — authenticated owner-only console
  # /api/public/onboarding/*     — unauthenticated form submit (token-gated)
  # ----------------------------------------------------------------
  EmployeesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackPrefix}-employees'
      CodeUri: backend/
      Handler: employees.handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EmployeesTable
        - S3CrudPolicy:
            BucketName: !Ref EmployeesFilledBucket
        - S3ReadPolicy:
            BucketName: !Ref PublicFormsBucket
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/admin/employees/{proxy+}' }
        GetRoot:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/admin/employees' }
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/admin/employees/{proxy+}' }
        PostRoot:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/admin/employees' }
        Put:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: '/api/admin/employees/{proxy+}' }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/admin/employees/{proxy+}' }
        PublicPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: '/api/public/onboarding/{proxy+}'
            Auth: { Authorizer: NONE }

  # ----------------------------------------------------------------
  # Business Case — daily marketing tasks (Casco Bay)
  # /api/business-case/*    — authenticated dashboard
  # ----------------------------------------------------------------
  BusinessCaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackPrefix}-business-case'
      CodeUri: backend/
      Handler: business_case.handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessCaseTable
        - DynamoDBReadPolicy:
            TableName: !Ref SettingsTable
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/business-case/{proxy+}' }
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/business-case/{proxy+}' }
        Put:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: '/api/business-case/{proxy+}' }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/business-case/{proxy+}' }

  # ----------------------------------------------------------------
  # Group Contracts — group bookings (Casco Bay)
  # /api/groups/*           — authenticated dashboard
  # /api/public/groups/*    — unauthenticated inquiry form
  # ----------------------------------------------------------------
  GroupContractsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackPrefix}-group-contracts'
      CodeUri: backend/
      Handler: group_contracts.handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GroupContractsTable
        - DynamoDBReadPolicy:
            TableName: !Ref SettingsTable
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/groups/{proxy+}' }
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/groups/{proxy+}' }
        Put:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: '/api/groups/{proxy+}' }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/groups/{proxy+}' }
        PublicGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: '/api/public/groups/{proxy+}'
            Auth: { Authorizer: NONE }
        PublicPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: '/api/public/groups/{proxy+}'
            Auth: { Authorizer: NONE }

  # ----------------------------------------------------------------
  # Inspections — room inspections + issues (Casco Bay)
  # /api/inspections/*          — authenticated dashboard
  # /api/public/inspections/*   — unauthenticated phone walk-form
  # Photos uploaded directly to InspectionPhotosBucket via presigned URL.
  # ----------------------------------------------------------------
  InspectionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackPrefix}-inspections'
      CodeUri: backend/
      Handler: inspections.handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InspectionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref SettingsTable
        - S3CrudPolicy:
            BucketName: !Ref InspectionPhotosBucket
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/inspections/{proxy+}' }
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/inspections/{proxy+}' }
        Put:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: '/api/inspections/{proxy+}' }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/inspections/{proxy+}' }
        PublicGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: '/api/public/inspections/{proxy+}'
            Auth: { Authorizer: NONE }
        PublicPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: '/api/public/inspections/{proxy+}'
            Auth: { Authorizer: NONE }
        PublicPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PUT
            Path: '/api/public/inspections/{proxy+}'
            Auth: { Authorizer: NONE }

  # ================================================================
  # S3 + CloudFront for frontend (optional)
  # ================================================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldDeployFrontend
    Properties:
      BucketName: !Sub '${StackPrefix}-frontend-${AWS::AccountId}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: ShouldDeployFrontend
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${StackPrefix}-frontend-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: ShouldDeployFrontend
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt FrontendOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponsePagePath: /index.html
            ResponseCode: 200
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponsePagePath: /index.html
            ResponseCode: 200
            ErrorCachingMinTTL: 0

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ShouldDeployFrontend
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

  # ================================================================
  # Billing Alarms
  # ================================================================
  BillingAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${StackPrefix}-billing-alarms'
      Subscription:
        - Endpoint: !Ref OwnerEmail
          Protocol: email

  BillingAlarmLow:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${StackPrefix}-billing-low'
      AlarmDescription: !Sub 'AWS estimated charges exceeded $${AlertEmailLow}'
      MetricName: EstimatedCharges
      Namespace: AWS/Billing
      Statistic: Maximum
      Period: 21600
      EvaluationPeriods: 1
      Threshold: !Ref AlertEmailLow
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: Currency
          Value: USD
      AlarmActions:
        - !Ref BillingAlarmTopic

  BillingAlarmHigh:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${StackPrefix}-billing-high'
      AlarmDescription: !Sub 'AWS estimated charges exceeded $${AlertEmailHigh}'
      MetricName: EstimatedCharges
      Namespace: AWS/Billing
      Statistic: Maximum
      Period: 21600
      EvaluationPeriods: 1
      Threshold: !Ref AlertEmailHigh
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: Currency
          Value: USD
      AlarmActions:
        - !Ref BillingAlarmTopic

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  ApiUrl:
    Description: HTTP API base URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  PublicFormsBucket:
    Description: S3 bucket holding the public static HTML forms
    Value: !Ref PublicFormsBucket
  PublicFormsUrl:
    Description: Base URL for the public static forms (S3 website endpoint)
    Value: !Sub 'http://${PublicFormsBucket}.s3-website-${AWS::Region}.amazonaws.com'
  DinnerFormUrl:
    Description: Public URL for the Casco Bay dinner-order form
    Value: !Sub 'http://${PublicFormsBucket}.s3-website-${AWS::Region}.amazonaws.com/dinner.html'
  HousekeepingFormUrl:
    Description: Public URL for the housekeeping form
    Value: !Sub 'http://${PublicFormsBucket}.s3-website-${AWS::Region}.amazonaws.com/housekeeping.html'
  OnboardingFormUrl:
    Description: Public URL for the employee onboarding form (token appended per invite)
    Value: !Sub 'http://${PublicFormsBucket}.s3-website-${AWS::Region}.amazonaws.com/onboarding.html'
  HandbookUrl:
    Description: Public URL for the employee handbook
    Value: !Sub 'http://${PublicFormsBucket}.s3-website-${AWS::Region}.amazonaws.com/handbook.html'
  EmployeesFilledBucket:
    Description: Private S3 bucket holding filled onboarding submissions
    Value: !Ref EmployeesFilledBucket
  InspectionPhotosBucket:
    Description: Private S3 bucket holding inspection before/after photos
    Value: !Ref InspectionPhotosBucket
  GroupInquiryFormUrl:
    Description: Public URL for the group inquiry form
    Value: !Sub 'http://${PublicFormsBucket}.s3-website-${AWS::Region}.amazonaws.com/groups.html'
  StockCheckFormUrl:
    Description: Public URL for the inventory stock-check form
    Value: !Sub 'http://${PublicFormsBucket}.s3-website-${AWS::Region}.amazonaws.com/inventory.html'
  InspectionFormUrl:
    Description: Public URL for the inspection walk-form
    Value: !Sub 'http://${PublicFormsBucket}.s3-website-${AWS::Region}.amazonaws.com/inspection.html'
  CloudFrontUrl:
    Description: CloudFront distribution URL (frontend)
    Condition: ShouldDeployFrontend
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  FrontendBucket:
    Description: S3 bucket for frontend uploads
    Condition: ShouldDeployFrontend
    Value: !Ref FrontendBucket
  Region:
    Description: Deployment region
    Value: !Ref AWS::Region
